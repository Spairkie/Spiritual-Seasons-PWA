<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4C7688" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Spiritual Seasons" />
  <meta name="description" content="A 120-day devotional journey through Winter, Spring, Summer, and Autumn. Discover your spiritual season and grow in faith." />

  <title>Spiritual Seasons | Daily Devotional</title>

  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <style>
    /* Inlined so the splash screen paints before any bundle loads. */
    html, body { margin: 0; padding: 0; background: #FBF9F5; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #EAF1F4 0%, #FBF9F5 100%);
      transition: opacity 0.4s ease-out;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 20px 40px rgba(76,118,136,.28); }
    #splash .name { margin-top: 20px; font: 600 22px/1 Georgia, serif; color: #1F1D1A; }
  </style>
</head>
<body>
  <noscript>Spiritual Seasons needs JavaScript enabled to run.</noscript>
  <div id="splash" aria-hidden="true">
    <img src="/assets/icons/icon.svg" alt="" />
    <div class="name">Spiritual Seasons</div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
