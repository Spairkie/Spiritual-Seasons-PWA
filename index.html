<!DOCTYPE html>
<html lang="en" data-season="winter" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4A90A4">
  
  <!-- Content Security Policy — no unsafe-inline in script-src -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src 'self' https://fonts.gstatic.com;
                 img-src 'self' data: blob:;
                 connect-src 'self';
                 media-src 'self' blob:;">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spiritual Seasons">
  <meta name="description" content="A 120-day devotional journey through Winter, Spring, Summer, and Autumn. Discover your spiritual season and grow in faith.">
  
  <title>Spiritual Seasons | Daily Devotional</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Architecture - Load order is critical -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/seasonal.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/ui-polish.css">
  
  <style>
    :root {
      --font-display-fallback: Georgia, 'Times New Roman', serif;
      --font-body-fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: linear-gradient(180deg, #E3F2FD 0%, #FFF8F0 100%);
      transition: opacity 0.5s ease-out;
    }
    .splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(74, 144, 164, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    .splash-title {
      margin-top: 24px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      color: #2C3E50;
    }
    .splash-subtitle {
      margin-top: 8px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 14px;
      color: #5D6D7E;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .error-boundary {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      padding: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splash">
    <img src="assets/icons/icon.svg" alt="Spiritual Seasons" class="splash-logo" id="splash-logo">
    <h1 class="splash-title">Spiritual Seasons</h1>
    <p class="splash-subtitle">Daily Devotional Workbook</p>
  </div>

  <noscript>
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; padding: 20px; text-align: center;">
      <h1>JavaScript Required</h1>
      <p>Please enable JavaScript to use the Spiritual Seasons devotional app.</p>
    </div>
  </noscript>

  <!-- NEW: Core Infrastructure (load FIRST) -->
  <script src="js/state-manager.js"></script>
  <script src="js/event-manager.js"></script>
  <script src="js/module-lifecycle.js"></script>
  <script src="js/blob-manager.js"></script>
  <script src="js/undo-manager.js"></script>
  <script src="js/search-engine.js"></script>
  <script src="js/sync-queue.js"></script>
  <script src="js/loading-manager.js"></script>

  <!-- Core utilities and configuration -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  
  <!-- UI Components -->
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/theme-manager.js"></script>
  
  <!-- Feature Modules -->
  <script src="js/modules/error-handler.js"></script>
  <script src="js/modules/error-boundary.js"></script>
  <script src="js/modules/haptics.js"></script>
  <script src="js/modules/keyboard-shortcuts.js"></script>
  <script src="js/modules/tts.js"></script>
  <script src="js/modules/ambient-sound.js"></script>
  <script src="js/modules/audio.js"></script>
  <script src="js/modules/intro-pages.js"></script>
  <script src="js/modules/quiz.js"></script>
  <script src="js/modules/devotional.js"></script>
  <script src="js/modules/toc.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/notifications.js"></script>
  <script src="js/modules/sharing.js"></script>
  <script src="js/modules/progress.js"></script>
  <script src="js/modules/weekly-reflection.js"></script>
  <script src="js/modules/search.js"></script>
  <script src="js/modules/privacy.js"></script>
  
  <!-- New Feature Modules -->
  <script src="js/modules/verse-images.js"></script>
  <script src="js/modules/meditation-timer.js"></script>
  <script src="js/modules/guided-breathing.js"></script>
  <script src="js/modules/calendar-integration.js"></script>
  <script src="js/modules/onboarding-tour.js"></script>
  <script src="js/modules/data-export.js"></script>
  <script src="js/modules/page-transitions.js"></script>
  <script src="js/modules/pdf-export.js"></script>
  
  <!-- Main app -->
  <script src="js/app.js"></script>
  
</body>
</html>
